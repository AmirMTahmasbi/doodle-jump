<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Political Peak Climb - Close to the Peak</title>
    <link rel="stylesheet" href="doodlejump.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&family=Indie+Flower&display=swap" rel="stylesheet">
    
    <!-- ADD THE SCRIPT HERE, INSIDE <head> -->
    <script>
        // Force font loading before game starts
        document.fonts.ready.then(function() {
            console.log('✅ All fonts loaded successfully');
        });
        
        // Preload fonts immediately
        if (document.fonts && document.fonts.load) {
            document.fonts.load('16px "Patrick Hand"');
            document.fonts.load('16px "Indie Flower"');
            document.fonts.load('bold 24px "Patrick Hand"');
            document.fonts.load('bold 32px "Patrick Hand"');
        }
    </script>
</head>
<body>
    <canvas id="board"></canvas>
    <script src="game-core.js"></script>
    <!-- Load responsive utilities first -->
    <script src="responsive-utils.js"></script>
    <script src="image-loader.js"></script>
    <script src="rendering.js"></script>
    <script src="moving-platform.js"></script>
    <script src="game-objects.js"></script>
    <script src="game-over.js"></script>
    <script src="input-controls.js"></script>
    <script src="menu.js"></script>
</body>
</html>
